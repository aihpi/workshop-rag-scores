[project]
name = "workshop-rag-scores"
version = "0.1.0"
description = "Instructor view over the anonymous score submissions of the RAG II chunking exercise."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "marimo>=0.24",
    "pandas>=2.0.0",
    "pyarrow>=15.0",
    "matplotlib>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
